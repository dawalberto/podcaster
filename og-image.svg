<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0b1437"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="halo" cx="22%" cy="42%" r="46%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0b1437" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="80%" cy="78%" r="42%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0b1437" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capsule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Background layers -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>
  <rect width="1200" height="630" fill="url(#halo2)"/>

  <!-- Frame brackets -->
  <g stroke="#22d3ee" stroke-opacity="0.4" stroke-width="2" fill="none">
    <path d="M48 96 V48 H120"/>
    <path d="M1152 96 V48 H1080"/>
    <path d="M48 534 V582 H120"/>
    <path d="M1152 534 V582 H1080"/>
  </g>

  <!-- Mic graphic on the right side -->
  <g transform="translate(820 90) scale(1.45)">
    <rect x="0" y="-20" width="180" height="320" rx="90" ry="90" fill="#22d3ee" fill-opacity="0.22" filter="url(#neon)"/>
    <rect x="14" y="-6" width="152" height="292" rx="76" ry="76" fill="url(#capsule)"/>
    <rect x="14" y="-6" width="152" height="292" rx="76" ry="76" fill="none" stroke="url(#stroke)" stroke-width="4"/>

    <g stroke="#0b1437" stroke-opacity="0.55" stroke-width="3.5" stroke-linecap="round">
      <line x1="44" y1="64" x2="136" y2="64"/>
      <line x1="44" y1="104" x2="136" y2="104"/>
      <line x1="44" y1="144" x2="136" y2="144"/>
      <line x1="44" y1="184" x2="136" y2="184"/>
      <line x1="44" y1="224" x2="136" y2="224"/>
    </g>

    <path d="M-58 200 V250 C-58 318 5 374 90 374 C175 374 238 318 238 250 V200"
          fill="none" stroke="url(#stroke)" stroke-width="16" stroke-linecap="round"/>
    <rect x="78" y="372" width="24" height="50" rx="8" fill="url(#stroke)"/>
    <rect x="0" y="418" width="180" height="22" rx="11" fill="url(#stroke)"/>
  </g>

  <!-- Title -->
  <text x="80" y="280" font-family="Futura, Helvetica Neue, sans-serif" font-size="124" font-weight="700" fill="url(#title)" letter-spacing="8">PODCASTER</text>

  <!-- Subtitle -->
  <text x="80" y="346" font-family="Futura, Helvetica Neue, sans-serif" font-size="32" font-weight="500" fill="#cbd5e1" letter-spacing="4">THE 100 MOST POPULAR PODCASTS</text>

  <!-- Description -->
  <text x="80" y="404" font-family="Helvetica Neue, sans-serif" font-size="24" font-weight="400" fill="#94a3b8" letter-spacing="0.5">Stream, browse and discover trending shows in one</text>
  <text x="80" y="436" font-family="Helvetica Neue, sans-serif" font-size="24" font-weight="400" fill="#94a3b8" letter-spacing="0.5">sleek, futurist listening experience.</text>

  <!-- Waveform accent -->
  <g stroke="#22d3ee" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="80" y1="510" x2="120" y2="510"/>
    <line x1="134" y1="498" x2="134" y2="522"/>
    <line x1="150" y1="486" x2="150" y2="534"/>
    <line x1="166" y1="478" x2="166" y2="542"/>
    <line x1="182" y1="486" x2="182" y2="534"/>
    <line x1="198" y1="498" x2="198" y2="522"/>
    <line x1="214" y1="490" x2="214" y2="530"/>
    <line x1="230" y1="478" x2="230" y2="542"/>
    <line x1="246" y1="486" x2="246" y2="534"/>
    <line x1="262" y1="498" x2="262" y2="522"/>
    <line x1="276" y1="510" x2="316" y2="510"/>
  </g>

  <!-- Domain / footer label -->
  <text x="80" y="568" font-family="Futura, Helvetica Neue, sans-serif" font-size="18" font-weight="600" fill="#67e8f9" letter-spacing="6">DAWALBERTO.GITHUB.IO/PODCASTER</text>
</svg>
